name: verify

# Runs the local verification harness (harness/verify.sh), including the
# stages that need a host where kind works: cluster-real and cluster-prod in
# the verify job, and pipeline (the Jenkinsfile run by Jenkins in kind) in its
# own job alongside it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages for the verify job (space-separated; empty = all but pipeline)"
        required: false
        default: ""
      pipeline_branch:
        description: "Branch name the pipeline job builds the commit as (develop or main)"
        required: false
        default: "develop"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harness prerequisites
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml
          podman --version

      - name: Run harness
        env:
          STAGES: ${{ inputs.stages || 'static app image pod cluster-sim terraform jenkins cluster-real cluster-prod' }}
        run: harness/verify.sh $STAGES

      - name: Summary
        if: always()
        run: |
          {
            echo '| Stage | Result | Time | Failed steps |'
            echo '|---|---|---|---|'
            jq -r '.stages[] | "| \(.stage) | \(.status) | \(.seconds)s | \([.steps[] | select(.status=="fail") | .name] | join(", ")) |"' \
              harness/.results/results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs of failed stages
        if: failure()
        run: |
          for stage in $(jq -r '.stages[] | select(.status=="fail") | .stage' harness/.results/results.json); do
            echo "::group::$stage"
            cat "harness/.results/logs/$stage.log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: harness/.results/
          include-hidden-files: true  # .results is a dot-directory
          retention-days: 14

  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PIPELINE_BRANCH: ${{ inputs.pipeline_branch || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the Jenkinsfile in Jenkins on kind
        run: harness/verify.sh pipeline

      - name: Summary
        if: always()
        run: |
          {
            echo "### Jenkinsfile on $PIPELINE_BRANCH"
            echo '| Step | Result | Time |'
            echo '|---|---|---|'
            jq -r '.stages[].steps[] | "| \(.name) | \(.status) | \(.seconds)s |"' harness/.results/results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage log
        if: failure()
        run: cat harness/.results/logs/pipeline.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results
          path: harness/.results/
          include-hidden-files: true
          retention-days: 14
