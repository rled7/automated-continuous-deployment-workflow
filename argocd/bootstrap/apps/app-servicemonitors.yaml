apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-servicemonitors
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/rled7/automated-continuous-deployment-workflow
    targetRevision: HEAD
    path: monitoring
    directory:
      include: 'servicemonitor.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
