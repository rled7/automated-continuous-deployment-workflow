apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Wave -10: install CRD controllers before application-layer components
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.11.3"
    helm:
      valuesObject:
        controller:
          # ── kind / local cluster ──────────────────────────────────────────
          # kind does not provision a cloud load-balancer; NodePort lets the
          # kind extraPortMappings (80 → 30080, 443 → 30443) reach the controller.
          # For a cloud deploy (EKS, GKE, AKS), change to:
          #   service.type: LoadBalancer
          # and remove the nodePorts block.
          service:
            type: NodePort
            nodePorts:
              http: "30080"
              https: "30443"
          # Publish the node's IP into the Ingress status so nip.io URLs resolve.
          hostNetwork: false
          # Resource requests suitable for a single-node kind cluster
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
