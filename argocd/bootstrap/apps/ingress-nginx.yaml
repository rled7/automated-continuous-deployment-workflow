apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Wave -10: install CRD controllers before application-layer components
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.11.3"
    helm:
      valuesObject:
        controller:
          # ── kind / local cluster ──────────────────────────────────────────
          # kind does not provision a cloud load-balancer; NodePort lets the
          # kind extraPortMappings (80 → 30080, 443 → 30443) reach the controller.
          # For a cloud deploy (EKS, GKE, AKS), change to:
          #   service.type: LoadBalancer
          # and remove the nodePorts block.
          service:
            type: NodePort
            nodePorts:
              http: "30080"
              https: "30443"
            # Local: kube-proxy delivers external traffic only to a controller
            # pod on the node it arrived at, without SNAT, so the controller
            # sees the client's real address and passes it on in
            # X-Forwarded-For. The app trusts exactly that one hop
            # (TRUST_PROXY=1 in k8s/base/configmap.yaml) to rate-limit per
            # client. With the default (Cluster) every request appears to come
            # from a node IP and all clients share one rate limit.
            # Nodes without a controller pod drop the traffic: on a multi-node
            # kind cluster keep the controller on the node with the
            # extraPortMappings; a cloud LoadBalancer health-checks nodes and
            # only sends traffic to those with a controller pod.
            externalTrafficPolicy: Local
          # Publish the node's IP into the Ingress status so nip.io URLs resolve.
          hostNetwork: false
          # Resource requests suitable for a single-node kind cluster
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
