apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 0: install after CRD controllers (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "67.9.0"
    helm:
      valuesObject:
        # ── Grafana ───────────────────────────────────────────────────────────
        grafana:
          # IMPORTANT: change this before exposing Grafana externally.
          adminPassword: changeme-bootstrap-only
          resources:
            requests:
              cpu: 50m
              memory: 128Mi

        # ── Prometheus ───────────────────────────────────────────────────────
        prometheus:
          prometheusSpec:
            # Reduced resource requests for kind/single-node clusters.
            # Increase for production: recommend 500m/2Gi minimum.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            # Single replica is sufficient for kind dev clusters.
            replicas: 1
            # Retain 24 h of data in kind (default 10d consumes too much disk).
            retention: 24h

            additionalScrapeConfigs:
              # ── my-app ────────────────────────────────────────────────────
              # The app's pods in production and staging, on container port
              # 3000 at /metrics. A plain scrape job rather than a
              # PodMonitor, so the app's overlays carry no Prometheus
              # operator CRDs. The job name is what AppDown matches
              # (up{job="my-app"}); rollouts_pod_template_hash is what the
              # canary analysis (k8s/overlays/production/analysis-template.yaml)
              # selects the canary's pods by. The allow-prometheus-scrape
              # NetworkPolicy in k8s/base lets these scrapes in.
              - job_name: my-app
                metrics_path: /metrics
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [production, staging]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app]
                    action: keep
                    regex: my-app
                  - source_labels: [__meta_kubernetes_pod_container_port_number]
                    action: keep
                    regex: "3000"
                  # Completed and pending pods have nothing to scrape.
                  - source_labels: [__meta_kubernetes_pod_phase]
                    action: keep
                    regex: Running
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
                    target_label: rollouts_pod_template_hash

              # ── Pushgateway (Build 015) ───────────────────────────────────
              # The Service in monitoring/pushgateway.yaml.
              # honor_labels: true preserves the job/instance labels pushed by
              # Jenkins so Prometheus does not overwrite them with its own values.
              # This is required for DORA metrics pushed from the Jenkinsfile.
              - job_name: pushgateway
                honor_labels: true
                static_configs:
                  - targets: ['pushgateway.monitoring.svc.cluster.local:9091']

              # ── Jenkins Prometheus plugin (Build 018) ─────────────────────
              # Requires the Jenkins Prometheus plugin (prometheus:latest) which
              # exposes /prometheus on the Jenkins HTTP port.
              # Adjust target if your Jenkins Service name/namespace differs.
              - job_name: jenkins
                metrics_path: /prometheus
                static_configs:
                  - targets: ['jenkins.jenkins.svc.cluster.local:8080']

        # ── Alert and recording rules for my-app ─────────────────────────────
        # Rendered as PrometheusRule objects in the monitoring namespace with
        # the release label the operator's ruleSelector matches. The series
        # come from the my-app scrape job above: the app's prom-client
        # histogram http_request_duration_ms (labels method, route,
        # status_code), plus the namespace and pod labels the job adds.
        additionalPrometheusRulesMap:
          my-app-alerts:
            groups:
              - name: my-app
                rules:
                  - alert: AppDown
                    expr: up{job="my-app"} == 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "App pod is down"
                      description: "{{ $labels.namespace }}/{{ $labels.pod }} has been down for > 1 minute"

                  - alert: HighErrorRate
                    expr: |
                      sum by (namespace) (rate(http_request_duration_ms_count{job="my-app",status_code=~"5.."}[5m]))
                      /
                      sum by (namespace) (rate(http_request_duration_ms_count{job="my-app"}[5m]))
                      > 0.05
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High HTTP error rate"
                      description: "5xx responses in {{ $labels.namespace }} are {{ $value | humanizePercentage }} of all requests"

                  - alert: HighResponseTime
                    # The histogram is in milliseconds.
                    expr: |
                      histogram_quantile(0.95,
                        sum by (namespace, le) (rate(http_request_duration_ms_bucket{job="my-app"}[5m]))
                      ) > 500
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High P95 response time"
                      description: "P95 latency in {{ $labels.namespace }} is {{ $value | humanize }} ms"

                  - alert: PodRestartingFrequently
                    expr: increase(kube_pod_container_status_restarts_total{namespace="production"}[1h]) > 3
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod restarting frequently"

              # Multi-window multi-burn-rate SLO alerts (99.9% availability SLO)
              # burn_rate = (1 - SLI) / (1 - 0.999) = error_rate / 0.001
              - name: slo-burn-rate
                rules:
                  # Fast burn: >14.4× error budget consumption over 1 h — page immediately
                  - alert: AvailabilitySLOFastBurn
                    expr: |
                      (
                        1 - http_requests:availability:ratio_rate5m
                      ) / (1 - 0.999) > 14.4
                    for: 1m
                    labels:
                      severity: page
                      slo: availability
                    annotations:
                      summary: "SLO fast burn: availability error budget burning >14.4×"
                      description: >-
                        Availability burn rate is {{ $value | humanize }}× the budget
                        consumption rate. At this rate the 30-day error budget will be
                        exhausted in < 2 hours. Immediate action required.

                  # Slow burn: >6× error budget consumption over 6 h — warning
                  - alert: AvailabilitySLOSlowBurn
                    expr: |
                      (
                        1 - http_requests:availability:ratio_rate5m
                      ) / (1 - 0.999) > 6
                    for: 6h
                    labels:
                      severity: warning
                      slo: availability
                    annotations:
                      summary: "SLO slow burn: availability error budget burning >6×"
                      description: >-
                        Availability burn rate is {{ $value | humanize }}× the budget
                        consumption rate for the past 6 h. At this rate the 30-day
                        error budget will be exhausted in < 5 days. Investigate soon.

          # SLIs for the SLOs in monitoring/slo.yaml, used by the burn-rate
          # alerts above and the SLO dashboard. Production only: staging's load
          # tests would otherwise count against the production error budget.
          my-app-recording-rules:
            groups:
              - name: sli-recording-rules
                interval: 60s
                rules:
                  # SLI: 5-minute rolling availability ratio (non-5xx / total)
                  - record: http_requests:availability:ratio_rate5m
                    expr: |
                      sum(rate(http_request_duration_ms_count{job="my-app",namespace="production",status_code!~"5.."}[5m]))
                      /
                      sum(rate(http_request_duration_ms_count{job="my-app",namespace="production"}[5m]))

                  # SLI: 5-minute rolling P95 latency (milliseconds)
                  - record: http_requests:latency:p95_5m
                    expr: |
                      histogram_quantile(
                        0.95,
                        sum(rate(http_request_duration_ms_bucket{job="my-app",namespace="production"}[5m])) by (le)
                      )

        # ── Alertmanager ─────────────────────────────────────────────────────
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
          # ── Alertmanager routing + receivers ─────────────────────────────
          # IMPORTANT: Replace dummy placeholder values below with real credentials
          # before deploying to production. Use SealedSecret + envFrom or Helm
          # --set flags to inject the real values. The "REPLACE_ME" strings are
          # intentional stand-ins so `helm template` renders without errors, but
          # they WILL NOT deliver alerts until substituted.
          config:
            global:
              resolve_timeout: 12h

            # ── Route tree ────────────────────────────────────────────────
            # Top-level receiver is slack-warnings (catch-all for warnings).
            # Severity-specific child routes override receiver and timing.
            route:
              receiver: slack-warnings
              group_by: ['alertname', 'namespace', 'severity']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Sev page → PagerDuty, fast grouping
                - matchers:
                    - name: severity
                      value: page
                  receiver: pagerduty
                  group_wait: 10s
                  repeat_interval: 4h

                # Sev warning → Slack #alerts-warning
                - matchers:
                    - name: severity
                      value: warning
                  receiver: slack-warnings
                  group_wait: 30s
                  repeat_interval: 12h

                # Sev critical → PagerDuty, no wait
                - matchers:
                    - name: severity
                      value: critical
                  receiver: pagerduty
                  group_wait: 0s

            # ── Receivers ─────────────────────────────────────────────────
            receivers:
              - name: pagerduty
                pagerduty_configs:
                  - routing_key: "REPLACE_ME"
                    # Replace with: ${PAGERDUTY_INTEGRATION_KEY} via SealedSecret/envFrom
                    description: '{{ template "pagerduty.default.description" . }}'
                    send_resolved: true

              - name: slack-warnings
                slack_configs:
                  - api_url: "https://hooks.slack.com/REPLACE_ME"
                    # Replace with: ${SLACK_WEBHOOK_URL} via SealedSecret/envFrom
                    channel: "#alerts-warning"
                    send_resolved: true
                    title: '{{ template "slack.default.title" . }}'
                    text: '{{ template "slack.default.text" . }}'

              - name: slack-critical
                slack_configs:
                  - api_url: "https://hooks.slack.com/REPLACE_ME"
                    # Replace with: ${SLACK_WEBHOOK_URL_CRITICAL} via SealedSecret/envFrom
                    channel: "#alerts-critical"
                    send_resolved: true
                    title: '{{ template "slack.default.title" . }}'
                    text: '{{ template "slack.default.text" . }}'

              # email-fallback: SMTP receiver used when both PagerDuty and Slack
              # are unreachable (e.g., during a major cloud-provider outage).
              # Configure via SealedSecret injecting SMTP credentials.
              - name: email-fallback
                email_configs:
                  - smarthost: "smtp.example.com:587"
                    # Replace with real SMTP host via SealedSecret/envFrom
                    from: "alertmanager@example.com"
                    to: "oncall@example.com"
                    auth_username: "REPLACE_ME"
                    auth_password: "REPLACE_ME"
                    send_resolved: true

            # ── Inhibition rules ──────────────────────────────────────────
            # Suppress warning-level alerts when a matching critical alert is
            # already firing on the same alertname + namespace.
            # Prevents double-paging for the same underlying failure.
            inhibit_rules:
              - source_matchers:
                  - name: severity
                    value: critical
                target_matchers:
                  - name: severity
                    value: warning
                equal: ['alertname', 'namespace']

            # ── Custom templates ──────────────────────────────────────────
            # To customise Slack/PagerDuty message formatting, add Alertmanager
            # template files (.tmpl) to:
            #   alertmanager.templateFiles.<name>.tmpl
            # or mount them as a ConfigMap under:
            #   /etc/alertmanager/templates/
            # Reference: https://prometheus.io/docs/alerting/latest/notifications/
            templates: []

        # ── Node Exporter ────────────────────────────────────────────────────
        # hostRootFsMount can fail on some kind/containerd configurations
        # because /proc is not visible at the expected host path.
        # Disable here; re-enable for bare-metal or cloud nodes.
        nodeExporter:
          hostRootFsMount:
            enabled: false

        # ── kube-state-metrics ───────────────────────────────────────────────
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

        # ── Prometheus Operator ──────────────────────────────────────────────
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # CRDs in this chart are large; server-side apply avoids annotation-size errors.
      - ServerSideApply=true
