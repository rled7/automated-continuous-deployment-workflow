apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 0: install after CRD controllers (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "67.9.0"
    helm:
      valuesObject:
        # ── Grafana ───────────────────────────────────────────────────────────
        grafana:
          # IMPORTANT: change this before exposing Grafana externally.
          adminPassword: changeme-bootstrap-only
          resources:
            requests:
              cpu: 50m
              memory: 128Mi

        # ── Prometheus ───────────────────────────────────────────────────────
        prometheus:
          prometheusSpec:
            # Reduced resource requests for kind/single-node clusters.
            # Increase for production: recommend 500m/2Gi minimum.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            # Single replica is sufficient for kind dev clusters.
            replicas: 1
            # Retain 24 h of data in kind (default 10d consumes too much disk).
            retention: 24h

            # ── Pushgateway scrape config (Build 015) ─────────────────────────
            # honor_labels: true preserves the job/instance labels pushed by
            # Jenkins so Prometheus does not overwrite them with its own values.
            # This is required for DORA metrics pushed from the Jenkinsfile.
            additionalScrapeConfigs:
              - job_name: pushgateway
                honor_labels: true
                static_configs:
                  - targets: ['prometheus-pushgateway.monitoring.svc.cluster.local:9091']

              # ── Jenkins Prometheus plugin (Build 018) ─────────────────────
              # Requires the Jenkins Prometheus plugin (prometheus:latest) which
              # exposes /prometheus on the Jenkins HTTP port.
              # Adjust target if your Jenkins Service name/namespace differs.
              - job_name: jenkins
                metrics_path: /prometheus
                static_configs:
                  - targets: ['jenkins.jenkins.svc.cluster.local:8080']

        # ── Alertmanager ─────────────────────────────────────────────────────
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
          # ── Alertmanager routing + receivers ─────────────────────────────
          # IMPORTANT: Replace dummy placeholder values below with real credentials
          # before deploying to production. Use SealedSecret + envFrom or Helm
          # --set flags to inject the real values. The "REPLACE_ME" strings are
          # intentional stand-ins so `helm template` renders without errors, but
          # they WILL NOT deliver alerts until substituted.
          config:
            global:
              resolve_timeout: 12h

            # ── Route tree ────────────────────────────────────────────────
            # Top-level receiver is slack-warnings (catch-all for warnings).
            # Severity-specific child routes override receiver and timing.
            route:
              receiver: slack-warnings
              group_by: ['alertname', 'namespace', 'severity']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Sev page → PagerDuty, fast grouping
                - matchers:
                    - name: severity
                      value: page
                  receiver: pagerduty
                  group_wait: 10s
                  repeat_interval: 4h

                # Sev warning → Slack #alerts-warning
                - matchers:
                    - name: severity
                      value: warning
                  receiver: slack-warnings
                  group_wait: 30s
                  repeat_interval: 12h

                # Sev critical → PagerDuty, no wait
                - matchers:
                    - name: severity
                      value: critical
                  receiver: pagerduty
                  group_wait: 0s

            # ── Receivers ─────────────────────────────────────────────────
            receivers:
              - name: pagerduty
                pagerduty_configs:
                  - routing_key: "REPLACE_ME"
                    # Replace with: ${PAGERDUTY_INTEGRATION_KEY} via SealedSecret/envFrom
                    description: '{{ template "pagerduty.default.description" . }}'
                    send_resolved: true

              - name: slack-warnings
                slack_configs:
                  - api_url: "https://hooks.slack.com/REPLACE_ME"
                    # Replace with: ${SLACK_WEBHOOK_URL} via SealedSecret/envFrom
                    channel: "#alerts-warning"
                    send_resolved: true
                    title: '{{ template "slack.default.title" . }}'
                    text: '{{ template "slack.default.text" . }}'

              - name: slack-critical
                slack_configs:
                  - api_url: "https://hooks.slack.com/REPLACE_ME"
                    # Replace with: ${SLACK_WEBHOOK_URL_CRITICAL} via SealedSecret/envFrom
                    channel: "#alerts-critical"
                    send_resolved: true
                    title: '{{ template "slack.default.title" . }}'
                    text: '{{ template "slack.default.text" . }}'

              # email-fallback: SMTP receiver used when both PagerDuty and Slack
              # are unreachable (e.g., during a major cloud-provider outage).
              # Configure via SealedSecret injecting SMTP credentials.
              - name: email-fallback
                email_configs:
                  - smarthost: "smtp.example.com:587"
                    # Replace with real SMTP host via SealedSecret/envFrom
                    from: "alertmanager@example.com"
                    to: "oncall@example.com"
                    auth_username: "REPLACE_ME"
                    auth_password: "REPLACE_ME"
                    send_resolved: true

            # ── Inhibition rules ──────────────────────────────────────────
            # Suppress warning-level alerts when a matching critical alert is
            # already firing on the same alertname + namespace.
            # Prevents double-paging for the same underlying failure.
            inhibit_rules:
              - source_matchers:
                  - name: severity
                    value: critical
                target_matchers:
                  - name: severity
                    value: warning
                equal: ['alertname', 'namespace']

            # ── Custom templates ──────────────────────────────────────────
            # To customise Slack/PagerDuty message formatting, add Alertmanager
            # template files (.tmpl) to:
            #   alertmanager.templateFiles.<name>.tmpl
            # or mount them as a ConfigMap under:
            #   /etc/alertmanager/templates/
            # Reference: https://prometheus.io/docs/alerting/latest/notifications/
            templates: []

        # ── Node Exporter ────────────────────────────────────────────────────
        # hostRootFsMount can fail on some kind/containerd configurations
        # because /proc is not visible at the expected host path.
        # Disable here; re-enable for bare-metal or cloud nodes.
        nodeExporter:
          hostRootFsMount:
            enabled: false

        # ── kube-state-metrics ───────────────────────────────────────────────
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

        # ── Prometheus Operator ──────────────────────────────────────────────
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # CRDs in this chart are large; server-side apply avoids annotation-size errors.
      - ServerSideApply=true
