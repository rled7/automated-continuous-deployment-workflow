apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    # Wave 0: install after CRD controllers (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.24.0"
    helm:
      valuesObject:
        # ── Single-binary mode for kind/dev clusters ──────────────────────────
        # In single-binary mode all Loki components (ingester, querier, etc.)
        # run in one StatefulSet — appropriate for local/dev; for production
        # switch to deploymentMode: Distributed or SimpleScalable.
        deploymentMode: SingleBinary

        loki:
          commonConfig:
            # Single replica — no replication needed for kind/dev.
            replication_factor: 1
          storage:
            # Filesystem storage avoids the need for object-store credentials
            # on a local cluster. For production use s3/gcs/azure.
            type: filesystem
          # Disable authentication for local dev convenience.
          auth_enabled: false

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          persistence:
            enabled: true
            size: 5Gi

        # Disable components that are not needed in single-binary mode
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # Disable the bundled Grafana (we use kube-prometheus-stack's Grafana)
        grafana:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
