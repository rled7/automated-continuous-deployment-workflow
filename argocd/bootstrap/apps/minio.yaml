# =============================================================================
# MinIO — S3-compatible object storage for kind/local clusters (Build 022)
# =============================================================================
#
# IMPORTANT — KIND/LOCAL ONLY
# ---------------------------
# This Application exists to provide a local S3-compatible backend so that
# Velero can be tested and demonstrated on a kind cluster without any cloud
# dependencies.
#
# SKIP THIS APPLICATION when deploying to a real cloud environment. Instead:
#   - AWS      → use an S3 bucket (create via Terraform / aws CLI)
#   - GCP      → use a GCS bucket
#   - Azure    → use an Azure Blob storage container
#
# To disable MinIO in a values override or ApplicationSet, set:
#   helm.parameters:
#     - name: enabled
#       value: "false"
#
# CREDENTIALS
# -----------
# The default access key and secret key below are PLACEHOLDERS. They must be
# replaced with a SealedSecret before the cluster stores anything sensitive.
# See docs/secrets.md for the SealedSecret workflow.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    # Wave -10: MinIO must be running before Velero tries to create a
    # BackupStorageLocation pointing at it.
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: "5.2.0"
    helm:
      valuesObject:
        # Standalone mode: single replica, no distributed erasure coding.
        # Sufficient for local/kind testing.
        # For production use the cloud provider's native object storage instead.
        mode: standalone

        # Replica count for standalone mode
        replicaCount: 1

        # Persistence: use a simple emptyDir-style PVC for kind.
        # Cloud deployments should use a StorageClass appropriate for the
        # cloud provider (gp3, pd-ssd, etc.).
        persistence:
          enabled: true
          size: 10Gi
          # storageClass: "" means use the cluster default StorageClass.
          # On kind this is typically "standard" (hostPath).

        # PLACEHOLDER CREDENTIALS — replace via SealedSecret before use.
        # These values are intentionally weak defaults for local demo use.
        rootUser: "minio-admin"
        rootPassword: "CHANGEME-use-sealed-secret"

        # Resource requests tuned for a kind cluster.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Create the Velero bucket automatically on first start.
        buckets:
          - name: velero-backups
            policy: none
            purge: false

        # Service type: ClusterIP so Velero can reach MinIO within the cluster.
        service:
          type: ClusterIP
          port: 9000

  destination:
    server: https://kubernetes.default.svc
    namespace: minio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
