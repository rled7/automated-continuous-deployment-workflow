apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    # Wave 0: install after CRD controllers (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.111.0"
    helm:
      valuesObject:
        # Deploy as a Deployment (single replica) rather than DaemonSet.
        # Switch to daemonset mode if you want per-node collection.
        mode: deployment

        replicaCount: 1

        resources:
          requests:
            cpu: 50m
            memory: 128Mi

        config:
          receivers:
            otlp:
              protocols:
                # OTLP/HTTP — used by the app's OpenTelemetry SDK (otel.js)
                http:
                  endpoint: "0.0.0.0:4318"
                # OTLP/gRPC — available for tools that prefer gRPC
                grpc:
                  endpoint: "0.0.0.0:4317"

          processors:
            batch: {}
            memory_limiter:
              check_interval: 1s
              limit_mib: 100

          exporters:
            # TODO: replace with otlp exporter pointing at Grafana Tempo once
            # Tempo is added to the bootstrap stack (planned for a future build).
            # Example config when Tempo is installed in the monitoring namespace:
            #   otlp:
            #     endpoint: "tempo.monitoring.svc.cluster.local:4317"
            #     tls:
            #       insecure: true
            #
            # For now, export to the logging exporter so traces are visible in
            # collector logs — useful for verifying the pipeline end-to-end on kind.
            logging:
              verbosity: detailed

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                # Stub exporter: logging only until Tempo is available.
                exporters: [logging]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [logging]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [logging]

        # Expose OTLP ports as a ClusterIP service so in-cluster apps can reach the collector.
        service:
          enabled: true

        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
