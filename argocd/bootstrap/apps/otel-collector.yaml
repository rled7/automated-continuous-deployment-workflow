apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    # Wave 0: install after CRD controllers (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.111.0"
    helm:
      valuesObject:
        # Deploy as a Deployment (single replica) rather than DaemonSet.
        # Switch to daemonset mode if you want per-node collection.
        mode: deployment

        replicaCount: 1

        resources:
          requests:
            cpu: 50m
            memory: 128Mi

        config:
          receivers:
            otlp:
              protocols:
                # OTLP/HTTP — used by the app's OpenTelemetry SDK (otel.js)
                http:
                  endpoint: "0.0.0.0:4318"
                # OTLP/gRPC — available for tools that prefer gRPC
                grpc:
                  endpoint: "0.0.0.0:4317"

          processors:
            batch: {}
            memory_limiter:
              check_interval: 1s
              limit_mib: 100

          exporters:
            # Build 015: replaced the logging stub with a real OTLP/gRPC exporter
            # pointing at Grafana Tempo (tempo.yaml added in the same build).
            # tls.insecure is acceptable for intra-cluster traffic; terminate TLS
            # at the ingress layer if Tempo is exposed externally.
            # The collector retries automatically if Tempo is not yet ready on
            # first sync — no explicit Argo CD dependsOn is required.
            otlp:
              endpoint: "tempo.monitoring.svc.cluster.local:4317"
              tls:
                insecure: true

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp]

        # Expose OTLP ports as a ClusterIP service so in-cluster apps can reach the collector.
        service:
          enabled: true

        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
