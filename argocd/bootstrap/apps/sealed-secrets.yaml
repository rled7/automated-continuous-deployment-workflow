apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Wave -10: install CRD controllers before issuers/dashboards
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "2.16.2"
    helm:
      valuesObject:
        # Deploy to kube-system so the controller's key lives alongside other
        # cluster-critical secrets.
        fullnameOverride: sealed-secrets-controller
        # Expose metrics for Prometheus scraping (optional — harmless if no
        # ServiceMonitor CRD is present yet)
        metrics:
          serviceMonitor:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
