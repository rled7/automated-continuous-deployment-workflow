apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-schedules
  namespace: argocd
  annotations:
    # Wave 10: deploy schedules after Velero (wave 0) is fully running so the
    # Velero CRDs (Schedule) are available when this Application syncs.
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/rled7/automated-continuous-deployment-workflow
    # Use directory source so individual Schedule manifests can be added or
    # removed without modifying this Application.
    path: monitoring/velero
    targetRevision: HEAD
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
