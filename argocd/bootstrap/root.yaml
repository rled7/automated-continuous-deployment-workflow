apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  # Cascade-delete all child Applications when the bootstrap Application is deleted.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/rled7/automated-continuous-deployment-workflow
    targetRevision: HEAD
    # Argo CD will discover and apply every Application manifest in this directory.
    path: argocd/bootstrap/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
