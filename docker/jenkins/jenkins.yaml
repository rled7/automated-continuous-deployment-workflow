# Jenkins Configuration as Code
# Automatically configures Jenkins on first boot — no manual setup needed.

jenkins:
  systemMessage: "Jenkins CI/CD — Configured via JCasC"
  numExecutors: 4
  mode: NORMAL
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Administrators"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "admin"
          - name: "developer"
            description: "Developers — read + build"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Read"

  globalNodeProperties:
    - envVars:
        env:
          - key: APP_NAME
            value: "my-app"
          - key: DOCKER_REGISTRY
            value: "localhost:5000"

  # ── Kubernetes cloud: spawns pods from the custom agent image (Build 013) ──
  # The image bundles every CLI the Jenkinsfile invokes. See docs/agent-image.md.
  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default.svc"
        namespace: "jenkins"
        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
        jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
        connectTimeout: 30
        readTimeout: 30
        containerCapStr: "10"
        templates:
          - name: "cicd-agent"
            label: "cicd-agent"
            namespace: "jenkins"
            serviceAccount: "jenkins-agent"
            yaml: |
              apiVersion: v1
              kind: Pod
              spec:
                containers:
                  - name: cicd
                    image: "ghcr.io/YOUR_ORG/jenkins-cicd-agent:latest"
                    imagePullPolicy: Always
                    command:
                      - sleep
                    args:
                      - infinity
                    tty: true
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                      limits:
                        cpu: "2"
                        memory: "4Gi"
                    volumeMounts:
                      - name: docker-sock
                        mountPath: /var/run/docker.sock
                volumes:
                  - name: docker-sock
                    hostPath:
                      path: /var/run/docker.sock
                      type: Socket

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "docker-registry-credentials"
              username: "${DOCKER_USER}"
              password: "${DOCKER_PASSWORD}"
              description: "Docker Registry"
          - string:
              id: "sonarqube-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube Token"
          - file:
              id: "kubeconfig"
              fileName: "kubeconfig"
              description: "Kubernetes Config"
          - string:
              id: "slack-token"
              secret: "${SLACK_TOKEN}"
              description: "Slack Bot Token"

tool:
  git:
    installations:
      - name: Default
        home: git
  nodejs:
    installations:
      - name: NodeJS-20
        version: "20.0.0"

unclassified:
  slackNotifier:
    teamDomain: "${SLACK_WORKSPACE}"
    tokenCredentialId: "slack-token"
    room: "#deployments"

  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"

jobs:
  - script: |
      multibranchPipelineJob('my-app') {
          branchSources {
              github {
                  id('my-app-github')
                  repoOwner('YOUR_ORG')
                  repository('my-app')
                  credentialsId('github-credentials')
                  traits {
                      gitHubBranchDiscovery { strategyId(1) }
                      gitHubPullRequestDiscovery { strategyId(1) }
                  }
              }
          }
          triggers {
              periodic(5)
          }
          factory {
              workflowBranchProjectFactory {
                  scriptPath('Jenkinsfile')
              }
          }
      }

  # ── Build 015: PR preview teardown job ─────────────────────────────────────
  # Triggered by a GitHub "pull_request closed" webhook via the
  # Generic Webhook Trigger plugin (generic-webhook-trigger in plugins.txt).
  # Webhook URL: http://JENKINS_URL/generic-webhook-trigger/invoke?token=pr-preview-teardown
  # GitHub webhook payload filter: $.action == "closed" (configure in GitHub repo settings)
  #
  # The job reads CHANGE_ID from the webhook JSON body ($.number field).
  # It then destroys the ephemeral PR preview namespace via pr-preview-down.sh.
  - script: |
      pipelineJob('pr-preview-teardown') {
          description('Tears down the ephemeral PR preview environment when a GitHub PR is closed.')
          parameters {
              stringParam('CHANGE_ID', '', 'PR number from the GitHub pull_request closed webhook ($.number)')
          }
          // Generic Webhook Trigger receives the GitHub pull_request event and
          // extracts $.number into CHANGE_ID automatically when configured with:
          //   Variable: CHANGE_ID, Expression: $.number, Expression type: JSONPath
          triggers {
              genericTrigger {
                  genericVariables {
                      genericVariable {
                          key('CHANGE_ID')
                          value('$.number')
                          expressionType('JSONPath')
                      }
                  }
                  token('pr-preview-teardown')
                  // Only fire when the pull_request action is "closed"
                  genericHeaderVariables {
                      genericHeaderVariable {
                          key('x-github-event')
                          regexpFilter('pull_request')
                      }
                  }
                  regexpFilterText('$action')
                  regexpFilterExpression('closed')
              }
          }
          definition {
              cps {
                  script('''
                      pipeline {
                          agent {
                              kubernetes {
                                  label 'cicd-agent'
                                  defaultContainer 'cicd'
                              }
                          }
                          stages {
                              stage('Teardown PR Preview') {
                                  steps {
                                      withCredentials([file(credentialsId: 'kubeconfig', variable: 'KUBECONFIG_FILE')]) {
                                          sh """
                                              export KUBECONFIG=\\$KUBECONFIG_FILE
                                              ./scripts/pr-preview-down.sh ${CHANGE_ID}
                                          """
                                      }
                                  }
                                  post {
                                      success {
                                          slackSend(
                                              channel: '#deployments',
                                              color: 'good',
                                              message: "PR Preview #${CHANGE_ID} torn down — namespace pr-preview-${CHANGE_ID} deleted."
                                          )
                                      }
                                      failure {
                                          slackSend(
                                              channel: '#deployments',
                                              color: 'danger',
                                              message: "WARNING: PR Preview #${CHANGE_ID} teardown FAILED — manual cleanup may be needed."
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  ''')
                  sandbox(true)
              }
          }
      }