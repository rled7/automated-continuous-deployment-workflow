# Kubernetes-only companions to deps.yaml (podman kube play has no Services).
apiVersion: v1
kind: Service
metadata:
  name: app-db
spec:
  selector:
    app: app-db
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-staging
spec:
  selector:
    app: redis
  ports:
    - port: 6379
