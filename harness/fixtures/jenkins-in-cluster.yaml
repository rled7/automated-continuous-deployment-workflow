# Jenkins running inside the cluster, where the Kubernetes cloud in
# docker/jenkins/jenkins.yaml expects it: API server at kubernetes.default.svc,
# controller at jenkins.jenkins.svc:8080, agents connecting back through
# jenkins-agent.jenkins.svc:50000, agent pods in namespace jenkins under the
# jenkins-agent service account. Used by the pipeline stage; __JENKINS_IMAGE__
# is replaced with the image built from docker/jenkins/Dockerfile.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
# What the Kubernetes plugin needs to run agent pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agents
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agents
  namespace: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agents
---
# The agent pods' own identity (pod template serviceAccount). Deploys use the
# kubeconfig credential instead, so it needs no permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
---
# Identity behind the kubeconfig credential deployToKubernetes(),
# runMigrations() and rollback() use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector: {app: jenkins}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-agent
  namespace: jenkins
spec:
  selector: {app: jenkins}
  ports:
    - {name: agent, port: 50000, targetPort: 50000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels: {app: jenkins}
  template:
    metadata:
      labels: {app: jenkins}
    spec:
      serviceAccountName: jenkins
      containers:
        - name: jenkins
          image: __JENKINS_IMAGE__
          ports:
            - containerPort: 8080
            - containerPort: 50000
          env:
            - {name: JAVA_OPTS, value: "-Djenkins.install.runSetupWizard=false"}
            - {name: CASC_JENKINS_CONFIG, value: /var/jenkins_home/casc_configs}
          # The variables jenkins.yaml substitutes (.env in docker-compose).
          envFrom:
            - secretRef: {name: jenkins-env}
          volumeMounts:
            - {name: casc, mountPath: /var/jenkins_home/casc_configs, readOnly: true}
            - {name: kubeconfig, mountPath: /run/secrets/kubeconfig, subPath: kubeconfig, readOnly: true}
          readinessProbe:
            httpGet: {path: /login, port: 8080}
            periodSeconds: 5
            failureThreshold: 120
      volumes:
        - name: casc
          configMap: {name: jenkins-casc}
        - name: kubeconfig
          secret: {secretName: jenkins-kubeconfig}
