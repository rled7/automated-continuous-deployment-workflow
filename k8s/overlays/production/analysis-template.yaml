apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    # The canary ReplicaSet's pod-template-hash. Every analysis step in the
    # Rollout passes it (valueFrom.podTemplateHashValue: Latest), so the query
    # judges only the new pods, not the stable ones next to them.
    - name: canary-hash
  metrics:
    - name: success-rate
      # Measure every 30 s, 3 times; every measurement must pass before the
      # canary moves on. Argo rejects the whole Rollout (InvalidSpec) if an
      # analysis step in a canary has no count, since it would never finish.
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.99
      failureLimit: 0
      # Three failed queries in a row (Prometheus unreachable, bad query) fail
      # the analysis, so a canary is never promoted without its metrics; one
      # transient error alone does not abort the release.
      consecutiveErrorLimit: 2
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          # Share of the canary's requests that were not 5xx, from the app's
          # prom-client histogram (http_request_duration_ms, labels method,
          # route, status_code). The my-app scrape job in kube-prometheus-stack
          # adds namespace and rollouts_pod_template_hash to every series.
          # With no requests at all both rates are 0 and the result is 1: the
          # `or vector(0)` keeps each side a one-element vector and clamp_min
          # avoids dividing by zero.
          query: |
            1 - (
              (sum(rate(http_request_duration_ms_count{namespace="production",rollouts_pod_template_hash="{{args.canary-hash}}",status_code=~"5.."}[2m])) or vector(0))
              /
              clamp_min((sum(rate(http_request_duration_ms_count{namespace="production",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])) or vector(0)), 1e-9)
            )
