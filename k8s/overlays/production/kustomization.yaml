apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - namespace.yaml

images:
  - name: my-app
    newName: my-app
    newTag: latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: my-app
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: my-app
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: my-app-config
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: my-app
