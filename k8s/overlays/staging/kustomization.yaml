apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - namespace.yaml

images:
  - name: my-app
    newName: my-app
    newTag: latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: my-app
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: my-app
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: my-app-config
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: my-app

# require-labels (Kyverno, Enforce) needs app, env and version on every pod
# template. env is fixed per overlay; version is the image tag, added at deploy
# time by deployToKubernetes() in the Jenkinsfile. Selectors are left alone:
# they are immutable on workloads that already exist.
labels:
  - pairs:
      env: staging
    includeTemplates: true
