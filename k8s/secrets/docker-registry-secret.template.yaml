# ──────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — DO NOT APPLY THIS FILE DIRECTLY TO YOUR CLUSTER.
#
# The encrypted values below are PLACEHOLDERS.  The real ciphertext is
# per-cluster (it is encrypted with the sealed-secrets controller's RSA key).
# You MUST re-generate this file against your own cluster's public key using:
#
#   # First create the dockerconfigjson secret and pipe to kubeseal:
#   kubectl create secret docker-registry docker-registry-secret \
#       --docker-server=<registry-host> \
#       --docker-username=<username> \
#       --docker-password=<password> \
#       --namespace=production \
#       --dry-run=client -o yaml \
#     | kubeseal --format=yaml --controller-namespace=kube-system \
#     > k8s/secrets/docker-registry-secret.yaml
#
# For the docker-registry type you will want to use kubectl create secret
# docker-registry and pipe directly through kubeseal rather than using
# scripts/seal-secret.sh (which is designed for generic secrets).
#
# Repeat for the staging namespace as needed.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: docker-registry-secret
  namespace: production   # Change to 'staging' for the staging overlay
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # REPLACE with kubeseal-generated ciphertext for .dockerconfigjson
    .dockerconfigjson: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: docker-registry-secret
      namespace: production
    type: kubernetes.io/dockerconfigjson
