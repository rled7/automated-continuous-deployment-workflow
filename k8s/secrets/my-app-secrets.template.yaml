# ──────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — DO NOT APPLY THIS FILE DIRECTLY TO YOUR CLUSTER.
#
# The encrypted values below are PLACEHOLDERS.  The real ciphertext is
# per-cluster (it is encrypted with the sealed-secrets controller's RSA key).
# You MUST re-generate this file against your own cluster's public key using:
#
#   scripts/seal-secret.sh <namespace> my-app-secrets \
#       db-host=<your-db-host> \
#       db-password=<your-db-password> \
#     > k8s/secrets/my-app-secrets.yaml
#
# Then commit k8s/secrets/my-app-secrets.yaml (the sealed output) — the
# plaintext values are never stored in git.
#
# Keys in this secret (Build 017):
#   db-host      — Postgres hostname (e.g. postgres.production.svc.cluster.local)
#   db-password  — Postgres password for DB_USER
#
# Note: DB_PORT, DB_USER, DB_NAME are non-sensitive and live in the ConfigMap
# overlays (k8s/overlays/{production,staging}/configmap-patch.yaml).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: my-app-secrets
  namespace: production   # Change to 'staging' for the staging overlay
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # REPLACE with kubeseal-generated ciphertext for db-host
    db-host: REPLACE_ME_WITH_KUBESEAL_OUTPUT
    # REPLACE with kubeseal-generated ciphertext for db-password
    db-password: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: my-app-secrets
      namespace: production
    type: Opaque
