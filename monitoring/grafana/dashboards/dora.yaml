# DORA metrics dashboard.
# Deployment frequency, lead time for changes, change failure rate, MTTR.
# Metrics are pushed to Prometheus via the Pushgateway from the Jenkinsfile
# (see monitoring/pushgateway.yaml and docs/dora-metrics.md).
# Every production build pushes its own group (instance=my-app-<BUILD_NUMBER>)
# of gauges, value 1 for deployment_frequency_total / change_failure_total, so
# the panels count groups instead of taking increase() of a counter. A
# group's push_time_seconds dates it, which is how a panel picks the builds in
# its window (joined on job and instance; nothing parses the instance value).
# Groups live until the Pushgateway restarts (no persistence).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dora
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dora.json: |
    {
      "title": "DORA Metrics",
      "uid": "my-app-dora",
      "schemaVersion": 38,
      "version": 1,
      "time": { "from": "now-30d", "to": "now" },
      "refresh": "5m",
      "timezone": "browser",
      "tags": ["my-app", "dora"],
      "panels": [
        {
          "id": 1,
          "title": "Deployment Frequency",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(count(deployment_frequency_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 86400)) or vector(0))",
              "legendFormat": "last 24h",
              "refId": "A",
              "instant": true
            },
            {
              "expr": "(count(deployment_frequency_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 604800)) or vector(0))",
              "legendFormat": "last 7d",
              "refId": "B",
              "instant": true
            },
            {
              "expr": "(count(deployment_frequency_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000)) or vector(0))",
              "legendFormat": "last 30d",
              "refId": "C",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "title": "Lead Time for Changes (p50/p95, 30d)",
          "type": "stat",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "quantile(0.5, lead_time_seconds and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": true
            },
            {
              "expr": "quantile(0.95, lead_time_seconds and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000))",
              "legendFormat": "p95",
              "refId": "B",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 3,
          "title": "Change Failure Rate",
          "type": "stat",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * (count(change_failure_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000)) or vector(0)) / clamp_min((count(deployment_frequency_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000)) or vector(0)) + (count(change_failure_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000)) or vector(0)), 1)",
              "legendFormat": "change failure %",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 15 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Mean Time to Restore (MTTR)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "avg(mttr_seconds > 0 and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 2592000))",
              "legendFormat": "MTTR (30d avg)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3600 },
                  { "color": "red", "value": 86400 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Deployment Frequency Over Time",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(count(deployment_frequency_total and on(job, instance) (push_time_seconds{job=\"jenkins\"} > time() - 86400)) or vector(0))",
              "legendFormat": "deploys in the previous 24h",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          }
        }
      ]
    }
