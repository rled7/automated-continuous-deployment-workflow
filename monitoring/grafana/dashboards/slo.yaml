# SLO burn-down dashboard.
# Shows availability SLI vs 99.9% target, error budget remaining,
# 1h and 6h burn rates, and current alert state.
# Relies on recording rules defined in monitoring/prometheus.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo.json: |
    {
      "title": "SLO — Availability & Error Budget",
      "uid": "my-app-slo",
      "schemaVersion": 38,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "timezone": "browser",
      "tags": ["my-app", "slo"],
      "panels": [
        {
          "id": 1,
          "title": "Availability SLI vs 99.9% Target",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "http_requests:availability:ratio_rate5m",
              "legendFormat": "SLI (availability)",
              "refId": "A"
            },
            {
              "expr": "0.999",
              "legendFormat": "SLO target (99.9%)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.99,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.998 },
                  { "color": "green", "value": 0.999 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "SLO target (99.9%)" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } },
                  { "id": "custom.lineStyle", "value": { "dash": [8, 4], "fill": "dash" } }
                ]
              }
            ]
          }
        },
        {
          "id": 2,
          "title": "Error Budget Remaining",
          "type": "stat",
          "gridPos": { "x": 0, "y": 8, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "1 - (1 - http_requests:availability:ratio_rate5m) / (1 - 0.999)",
              "legendFormat": "budget remaining",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.25 },
                  { "color": "green", "value": 0.5 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "1h Burn Rate (× budget)",
          "type": "stat",
          "gridPos": { "x": 8, "y": 8, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(1 - http_requests:availability:ratio_rate5m) / (1 - 0.999)",
              "legendFormat": "burn rate 1h",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 6 },
                  { "color": "red", "value": 14.4 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "6h Burn Rate (× budget)",
          "type": "stat",
          "gridPos": { "x": 16, "y": 8, "w": 8, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(1 - http_requests:availability:ratio_rate5m) / (1 - 0.999)",
              "legendFormat": "burn rate 6h",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "red", "value": 6 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "SLO Alert State",
          "type": "table",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "ALERTS{slo=\"availability\"}",
              "legendFormat": "{{alertname}} [{{alertstate}}]",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          }
        }
      ]
    }
