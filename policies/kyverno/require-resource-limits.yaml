# =============================================================================
# require-resource-limits — Promoted to Enforce (Build 021)
# =============================================================================
#
# WHY THIS IS SAFE TO ENFORCE
# ----------------------------
# The production app Deployment (k8s/base/deployment.yaml) already specifies
# CPU/memory requests and limits on every container. A full soak period in
# Audit mode (Build 016 → Build 021) showed zero violations in PolicyReports.
#
# IF THIS BREAKS A FUTURE WORKLOAD
# ----------------------------------
# Add resource requests/limits to the container spec. If a workload legitimately
# cannot define limits (e.g., a batch job needing dynamic resources), create a
# time-bound PolicyException in policies/kyverno/policy-exceptions/:
#
#   kubectl apply -f policies/kyverno/policy-exceptions/<policy-name>-<reason>.yaml
#
# Example one-liner:
#   kubectl annotate policyexception my-exception expiry="2026-09-01" -n production
#
# See policies/kyverno/policy-exceptions/README.md for the full exception workflow.
# =============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Requires all containers to have CPU and memory requests and limits set.
      Running without limits risks resource starvation and node instability.
      Promoted to Enforce in Build 021 after a soak period confirmed all
      workloads define resource limits.
spec:
  # Enforce mode: pods without CPU/memory requests+limits will be rejected.
  # Promoted from Audit in Build 021 — zero violations observed during soak.
  validationFailureAction: Enforce

  background: true

  rules:
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          All containers must define resources.requests and resources.limits for
          both cpu and memory. Add these to your container spec to resolve the
          violation.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
